        '200':
          description: Credential metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCredential
      parameters:
        - $ref: '#/components/parameters/CredentialNamespace'
        - $ref: '#/components/parameters/CredentialName'
      responses:
        '204': { description: Credential deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /credentials/{namespace}/{name}/rotate:
    post:
      operationId: rotateCredential
      parameters:
        - $ref: '#/components/parameters/CredentialNamespace'
        - $ref: '#/components/parameters/CredentialName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCredentialRequest' }
      responses:
        '200':
          description: Credential metadata after rotation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }
    ToolId:
      name: toolId
      in: path
      required: true
      schema: { type: string }
    ProfileSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string }
    CredentialNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    CredentialName:
      name: name
      in: path
      required: true
      schema: { type: string }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Request provenance rejected, or Policy/Approval denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: Provider or execution failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: false
    SystemStatus:
      type: object
      required: [ready, policy, credentials, mcp]
      properties:
        ready: { type: boolean }
        policy: { $ref: '#/components/schemas/PolicyStatus' }
        credentials: { $ref: '#/components/schemas/CredentialStatus' }
        mcp:
          type: object
          required: [stdio, streamableHttp, exposureModes]
          properties:
            stdio: { type: boolean }
            streamableHttp: { type: boolean }
            exposureModes:
              type: array
              items: { type: string, enum: [direct, dynamic, hybrid] }
    RuntimeGovernanceStatus:
      type: object
      required: [budget, isolation, backend, usage]
      properties:
        budget: { $ref: '#/components/schemas/RuntimeBudget' }
        isolation: { $ref: '#/components/schemas/RuntimeIsolation' }
        backend: { $ref: '#/components/schemas/RuntimeBackend' }
        usage: { $ref: '#/components/schemas/RuntimeUsage' }
      additionalProperties: false
    RuntimeBudget:
      type: object
      required: [maxInvocations, maxPrincipalInvocations, maxProviderInvocations, maxToolInvocations, maxProviderActivations, maxExecutionTimeoutMs, maxArgumentBytes, maxResultBytes]
      properties:
        maxInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxPrincipalInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxProviderInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxToolInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxProviderActivations: { type: integer, minimum: 1, maximum: 4096 }
        maxExecutionTimeoutMs: { type: integer, format: int64, minimum: 1, maximum: 86400000 }
        maxArgumentBytes: { type: integer, minimum: 1, maximum: 67108864 }
        maxResultBytes: { type: integer, minimum: 1, maximum: 67108864 }
      additionalProperties: false
    RuntimeIsolation:
      type: object
      required: [workspaceShell, externalProvider, tunnelClient]
      properties:
        workspaceShell: { type: string, enum: [host, restricted_host] }
        externalProvider: { type: string, enum: [host, restricted_host] }
        tunnelClient: { type: string, enum: [host, restricted_host] }
      additionalProperties: false
    RuntimeBackend:
      type: object
      required: [name, restrictedHostAvailable]
      properties:
        name: { type: string }
        restrictedHostAvailable: { type: boolean }
      additionalProperties: false
    RuntimeUsage:
      type: object
      required: [invocations, activations]
      properties:
        invocations: { type: integer, minimum: 0 }
        activations: { type: integer, minimum: 0 }
      additionalProperties: false
    PolicyStatus:
      type: object
      required: [mode, editable, approval, defaultDecision, ruleCount, enabledRuleCount]
      properties:
        mode: { type: string, enum: [configured] }
        editable: { type: boolean, const: true }
        approval: { type: string, enum: [fail_closed_when_required] }
        defaultDecision: { $ref: '#/components/schemas/PolicyDecision' }
        ruleCount: { type: integer, minimum: 0 }
        enabledRuleCount: { type: integer, minimum: 0 }
    PolicyDecision:
      type: string
      enum: [allow, require_approval, deny]
    Policy:
      type: object
      required: [defaultDecision, rules]
      properties:
        defaultDecision: { $ref: '#/components/schemas/PolicyDecision' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRule' }
    PolicyDefaultRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/PolicyDecision' }
      additionalProperties: false
    PolicyRule:
      type: object
      required: [ruleId, displayName, enabled, decision, match, createdAt, updatedAt]
      properties:
        ruleId: { type: string }
        displayName: { type: string }
        enabled: { type: boolean }
        decision: { $ref: '#/components/schemas/PolicyDecision' }
        match: { $ref: '#/components/schemas/PolicyMatch' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PolicyRuleInput:
      type: object
      required: [displayName, enabled, decision, match]
      properties:
        displayName: { type: string }
        enabled: { type: boolean }
        decision: { $ref: '#/components/schemas/PolicyDecision' }
        match: { $ref: '#/components/schemas/PolicyMatch' }
      additionalProperties: false
    PolicyMatch:
      type: object
      required: [actions, origins, principalKinds, principalRefs, scopeKinds, profileRefs, providerIds, toolIds, factKnowledge, effectsAny, resourcesAny]
      properties:
        actions:
          type: array
          minItems: 1
          items: { type: string, enum: [tool.invoke, provider.activate, sandbox.acquire, sandbox.provision, sandbox.start, sandbox.stop, sandbox.destroy, sandbox.reconcile] }
        origins:
          type: array
          items: { type: string, enum: [cli, mcp, management_http, desktop, internal] }
        principalKinds:
          type: array
          items: { type: string, enum: [local_user, service] }
        principalRefs:
          type: array
          items: { type: string }
        scopeKinds:
          type: array
          items: { type: string, enum: [catalog, profile] }
        profileRefs:
          type: array
          items: { type: string }
        providerIds:
          type: array
          items: { type: string }
        toolIds:
          type: array
          items: { type: string }
        factKnowledge: { type: string, enum: [any, known, unknown] }
        effectsAny:
          type: array
          items: { type: string }
        resourcesAny:
          type: array
          items: { $ref: '#/components/schemas/PolicyResourceMatcher' }
      additionalProperties: false
    PolicyResourceMatcher:
      type: object
      required: [kind, operator, value]
      properties:
        kind: { type: string }
        operator: { type: string, enum: [exact, prefix] }
        value: { type: string }
      additionalProperties: false
    CredentialStatus:
      type: object
      required: [resolver, persistentStore, editable]
      properties:
        resolver: { type: string, enum: [inventory] }
        persistentStore: { type: boolean, const: true }
        editable: { type: boolean, const: true }
    Credential:
      type: object
      required: [reference, namespace, name, displayName, source, environmentVariable, createdAt, updatedAt]
      properties:
        reference: { type: string }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [native, environment] }
        environmentVariable: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateNativeCredentialRequest:
      type: object
      required: [namespace, name, displayName, secret]
      properties:
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        secret: { type: string, writeOnly: true }
      additionalProperties: false
    CreateEnvironmentCredentialRequest:
      type: object
      required: [namespace, name, displayName, environmentVariable]
      properties:
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        environmentVariable: { type: string }
      additionalProperties: false
    RotateCredentialRequest:
      type: object
      required: [secret]
      properties:
        secret: { type: string, writeOnly: true }
      additionalProperties: false
    ProviderPlugin:
      type: object
      required: [pluginId, version, packageVersion, displayName, description, configVersion, sourceKind, capabilities, enabled]
      properties:
        pluginId: { type: string }
        version: { type: string }
        packageVersion: { type: string }
        displayName: { type: string }
        description: { type: string }
        configVersion: { type: integer, minimum: 1 }
        sourceKind:
          type: string
          enum: [builtin, external]
        installationId: { type: string }
        protocolVersion: { type: integer, minimum: 1 }
        configSchema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: boolean
        uiSchema:
          type: object
          additionalProperties: true
        capabilities:
          type: array
          items: { type: string }
        enabled: { type: boolean }
      additionalProperties: false
    ProviderPluginIssue:
      type: object
      required: [installationId, code, message]
      properties:
        installationId: { type: string }
        code: { type: string }
        message: { type: string, maxLength: 1024 }
      additionalProperties: false
    ProviderPluginInstallation:
      type: object
      required: [installationId, pluginId, packageVersion, sourceKind, digest, status, installedAt]
      properties:
        installationId: { type: string }
        pluginId: { type: string }
        packageVersion: { type: string }
        sourceKind:
          type: string
          enum: [local]
        digest: { type: string }
        status:
          type: string
          enum: [enabled, disabled, invalid]
        installedAt: { type: string, format: date-time }
        displayName: { type: string }
        description: { type: string }
        configVersion: { type: integer, minimum: 1 }
        protocolVersion: { type: integer, minimum: 1 }
        capabilities:
          type: array
          items: { type: string }
      additionalProperties: false
    SkillInstallation:
      type: object
      required: [skillId, installationId, name, description, sourceKind, sourceReference, digest, versionHint, trusted, enabled, builtIn]
      properties:
        skillId: { type: string }
        installationId: { type: string }
        name: { type: string }
        description: { type: string }
        sourceKind:
          type: string
          enum: [builtin, local-directory]
        sourceReference: { type: string }
        digest: { type: string }
        versionHint: { type: string }
        trusted: { type: boolean }
        enabled: { type: boolean }
        builtIn: { type: boolean }
        installedAt: { type: string, format: date-time }
      additionalProperties: false
    SkillMetadata:
      type: object
      required: [name, description, metadata]
      properties:
        name: { type: string }
        description: { type: string }
        license: { type: string }
        compatibility: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        allowedTools: { type: string }
      additionalProperties: false
    SkillResource:
      type: object
      required: [path, kind, size, sha256, executable]
      properties:
        path: { type: string }
        kind:
          type: string
          enum: [manifest, script, reference, asset, other]
        size: { type: integer, minimum: 0 }
        sha256: { type: string }
        executable: { type: boolean }
      additionalProperties: false
    SkillInspection:
      type: object
      required: [installation, metadata, resources, totalBytes]
      properties:
        installation:
          $ref: '#/components/schemas/SkillInstallation'
        metadata:
          $ref: '#/components/schemas/SkillMetadata'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/SkillResource'
        totalBytes: { type: integer, minimum: 0 }
      additionalProperties: false
    SkillDeployment:
      type: object
      required: [deploymentId, installationId, target, root, destination, digest, deployedAt, drift]
      properties:
        deploymentId: { type: string }
        installationId: { type: string }
        target:
          type: string
          enum: [agents-project, github-project, claude-project, agents-user, copilot-user]
        root: { type: string }
        destination: { type: string }
        digest: { type: string }
        deployedAt: { type: string, format: date-time }
        drift:
          type: string
          enum: [current, drifted, missing]
        currentDigest: { type: string }
      additionalProperties: false
    Provider:
      type: object
      required: [providerId, namespace, displayName, description, createdAt, updatedAt, transport, toolCount]
      properties:
        providerId: { type: string }
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pluginId: { type: string }
        installationId: { type: string }
        pluginVersion: { type: string }
        pluginDisplayName: { type: string }
        configVersion: { type: integer, minimum: 1 }
        connectionSummary: { type: string, maxLength: 4096 }
        config:
          type: object
          additionalProperties: true
        transport:
          type: string
          enum: [http, stdio, unconfigured]
          description: Compatibility projection for the built-in MCP plugin. New clients should use pluginId and config.
        toolCount: { type: integer, minimum: 0 }
        endpoint: { type: string }
        headers:
          $ref: '#/components/schemas/HeaderTemplates'
        credentialHeaders:
          type: array
          items: { $ref: '#/components/schemas/CredentialHeaderBinding' }
        executable: { type: string }
        args:
          type: array
          items: { type: string }
        directory: { type: string }
        credentialEnvironment:
          type: array
          items: { $ref: '#/components/schemas/CredentialEnvironmentBinding' }
    CreateProviderRequest:
      type: object
      required: [namespace, displayName, pluginId, config]
      properties:
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        pluginId: { type: string }
        installationId: { type: string }
        config:
          type: object
          additionalProperties: true
      additionalProperties: false
    RebindProviderRequest:
      type: object
      required: [installationId, config]
      properties:
        installationId: { type: string }
        config:
          type: object
          additionalProperties: true
      additionalProperties: false
    CreateHTTPProviderRequest:
      type: object
      required: [namespace, displayName, endpoint]
      properties:
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        endpoint: { type: string, format: uri }
        headers:
          $ref: '#/components/schemas/HeaderTemplates'
        credentialHeaders:
          type: array
          items: { $ref: '#/components/schemas/CredentialHeaderBinding' }
      additionalProperties: false
    CreateStdioProviderRequest:
      type: object
      required: [namespace, displayName, executable]
      properties:
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        executable: { type: string }
        args:
          type: array
          items: { type: string }
        directory: { type: string }
        credentialEnvironment:
          type: array
          items: { $ref: '#/components/schemas/CredentialEnvironmentBinding' }
      additionalProperties: false
    UpdateProviderRequest:
      oneOf:
        - $ref: '#/components/schemas/UpdateConfiguredProviderRequest'
        - $ref: '#/components/schemas/UpdateHTTPProviderRequest'
        - $ref: '#/components/schemas/UpdateStdioProviderRequest'
    UpdateConfiguredProviderRequest:
      type: object
      required: [displayName, config]
      properties:
        displayName: { type: string }
        description: { type: string }
        config:
          type: object
          additionalProperties: true
      additionalProperties: false
    UpdateHTTPProviderRequest:
      type: object
      required: [transport, displayName, endpoint]
      properties:
        transport: { type: string, const: http }
        displayName: { type: string }
        description: { type: string }
        endpoint: { type: string, format: uri }
        headers:
          $ref: '#/components/schemas/HeaderTemplates'
        credentialHeaders:
          type: array
          items: { $ref: '#/components/schemas/CredentialHeaderBinding' }
      additionalProperties: false
    UpdateStdioProviderRequest:
      type: object
      required: [transport, displayName, executable]
      properties:
        transport: { type: string, const: stdio }
        displayName: { type: string }
        description: { type: string }
        executable: { type: string }
        args:
          type: array
          items: { type: string }
        directory: { type: string }
        credentialEnvironment:
          type: array
          items: { $ref: '#/components/schemas/CredentialEnvironmentBinding' }
      additionalProperties: false
    CredentialHeaderBinding:
      type: object
      required: [name, scheme, credentialRef]
      properties:
        name: { type: string }
        scheme: { type: string }
        credentialRef: { type: string }
      additionalProperties: false
    CredentialEnvironmentBinding:
      type: object
      required: [name, credentialRef]
      properties:
        name: { type: string }
        credentialRef: { type: string }
      additionalProperties: false
    HeaderTemplates:
      type: object
      description: Persisted HTTP header templates. Sensitive headers must reference environment variables, for example "Bearer ${ANYSEARCH_API_KEY}".
      additionalProperties:
        type: string
    ProviderMutationResponse:
      type: object
      required: [provider, sync]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        sync: { $ref: '#/components/schemas/SyncResult' }
    SyncResult:
      type: object
      required: [created, updated, removed, total]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ToolSummary:
      type: object
      required: [rank, toolId, providerId, name, title, description]
      properties:
        rank: { type: integer, minimum: 1 }
        toolId: { type: string }
        providerId: { type: string }
        name: { type: string }
        title: { type: string }
        description: { type: string }
    ToolDetail:
      type: object
      required: [toolId, providerId, sourceKey, name, title, description, inputSchema, tags]
      properties:
        toolId: { type: string }
        providerId: { type: string }
        sourceKey: { type: string }
        name: { type: string }
        title: { type: string }
        description: { type: string }
        inputSchema: {}
        outputSchema: {}
        tags:
          type: array
          items: { type: string }
    ToolCallRequest:
      type: object
      required: [arguments]
      properties:
        arguments:
          type: object
          additionalProperties: true
      additionalProperties: false
    InvocationResult:
      type: object
      required: [invocationId, kind]
      properties:
        invocationId: { type: string }
        kind: { type: string, enum: [complete, input_required, task, rejected, failed] }
        content: {}
        requestId: { type: string }
        message: { type: string }
        inputSchema: {}
        taskId: { type: string }
        status: { type: string }
        source: { type: string, enum: [tool, provider, runtime, result_guard] }
        code: { type: string }
    CreateProfileRequest:
      type: object
      required: [slug, displayName, mode]
      properties:
        slug: { type: string }
        displayName: { type: string }
        mode: { type: string, enum: [direct, dynamic, hybrid] }
      additionalProperties: false
    AddProfileToolRequest:
      type: object
      required: [toolId]
      properties:
        toolId: { type: string }
        direct: { type: boolean }
        alias: { type: string }
        titleOverride: { type: string }
        descriptionOverride: { type: string }
        policyConstraint: { type: string, enum: [inherit, require_approval, deny] }
        concurrencyConstraint: { type: string, enum: [inherit, serial] }
        credentialRefs:
          type: array
          items: { type: string }
      additionalProperties: false
    ReplaceProfileToolsRequest:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ProfileToolInput'
      additionalProperties: false
    ProfileToolInput:
      type: object
      required: [toolId]
      properties:
        toolId: { type: string }
        direct: { type: boolean }
        alias: { type: string }
        titleOverride: { type: string }
        descriptionOverride: { type: string }
        policyConstraint: { type: string, enum: [inherit, require_approval, deny] }
        concurrencyConstraint: { type: string, enum: [inherit, serial] }
        credentialRefs:
          type: array
          items: { type: string }
      additionalProperties: false
    ProfileTool:
      type: object
      required: [toolId, direct, alias, titleOverride, descriptionOverride, policyConstraint, concurrencyConstraint, credentialRefs]
      properties:
        toolId: { type: string }
        direct: { type: boolean }
        alias: { type: string }
        titleOverride: { type: string }
        descriptionOverride: { type: string }
        policyConstraint: { type: string, enum: [inherit, require_approval, deny] }
        concurrencyConstraint: { type: string, enum: [inherit, serial] }
        credentialRefs:
          type: array
          items: { type: string }
    Profile:
      type: object
      required: [profileId, slug, displayName, mode, tools]
      properties:
        profileId: { type: string }
        slug: { type: string }
        displayName: { type: string }
        mode: { type: string, enum: [direct, dynamic, hybrid] }
        tunnelId: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ProfileTool' }
    SetProfileTunnelRequest:
      type: object
      required: [tunnelId]
      properties:
        tunnelId:
          type: string
          description: Mender Tunnel ID. Send an empty string to clear the binding.
      additionalProperties: false
    CreateOpenAITunnelRequest:
      type: object
      required: [displayName, externalTunnelId, runtimeCredentialRef]
      properties:
        displayName: { type: string }
        externalTunnelId:
          type: string
          description: OpenAI Secure MCP Tunnel ID.
        runtimeCredentialRef:
          type: string
          description: Mender Credential Reference containing the OpenAI tunnel runtime API key.
      additionalProperties: false
    SandboxProfileCapability:
      type: string
      enum: ['file.read', 'file.search', 'file.edit', 'process.shell']
    SandboxProfileGrant:
      type: object
      additionalProperties: false
      required: [profileId, capabilities]
      properties:
        profileId: { type: string, pattern: '^prof_[0-9a-f]{32}$' }
        capabilities:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/SandboxProfileCapability' }
    SandboxProfileGrants:
      type: object
      additionalProperties: false
      required: [sandboxId, grants]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/SandboxProfileGrant' }
    ReplaceSandboxProfileGrantsRequest:
      type: object
      additionalProperties: false
      required: [capabilities]
      properties:
        capabilities:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/SandboxProfileCapability' }
    SandboxProfileGrantEvent:
      type: object
      additionalProperties: false
      required: [profileId, capability, action, occurredAt]
      properties:
        profileId: { type: string, pattern: '^prof_[0-9a-f]{32}$' }
        capability: { $ref: '#/components/schemas/SandboxProfileCapability' }
        action: { type: string, enum: [grant, revoke] }
        occurredAt: { type: string, format: date-time }
    SandboxProfileGrantEvents:
      type: object
      additionalProperties: false
      required: [sandboxId, events]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SandboxProfileGrantEvent' }
    SandboxActivity:
      type: object
      additionalProperties: false
      required: [sandboxId, limit, events]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SandboxActivityEvent' }
    SandboxActivityEvent:
      type: object
      additionalProperties: false
      required: [kind, action, status, occurredAt, principalKind, origin]
      properties:
        kind: { type: string, enum: [admission, lifecycle] }
        action: { type: string, enum: ['sandbox.provision', 'sandbox.acquire', 'sandbox.start', 'sandbox.stop', 'sandbox.destroy', 'sandbox.reconcile'] }
        status: { type: string, enum: [admitted, denied, failed, completed] }
        occurredAt: { type: string, format: date-time }
        principalKind: { type: string }
        origin: { type: string }
        policyDecision: { type: string }
        generation: { type: integer, minimum: 1 }
        previousState: { type: string }
        nextState: { type: string }
    SandboxBackends:
      type: object
      required: [dockerAvailable, dockerStatus, daytonaConfigured, daytonaStatus]
      properties:
        dockerAvailable: { type: boolean }
        dockerStatus: { type: string }
        daytonaConfigured: { type: boolean, description: Explicit host-operator experimental execution opt-in; disabled by default, never proof of live remote acceptance }
        daytonaStatus: { type: string }
      additionalProperties: false
    CreateDaytonaSandboxRequest:
      type: object
      required: [name, credentialRef, imageDigest, target, cpu, memoryGiB, diskGiB, ttlMinutes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        credentialRef: { type: string, pattern: '^credential://[a-z][a-z0-9-]*/[a-z][a-z0-9-]*$', description: Reference to Mender's secret inventory, never plaintext }
        imageDigest: { type: string, minLength: 72, maxLength: 320 }
        target: { type: string, enum: [us] }
        cpu: { type: integer, minimum: 1, maximum: 2 }
        memoryGiB: { type: integer, minimum: 1, maximum: 4 }
        diskGiB: { type: integer, minimum: 3, maximum: 10 }
        ttlMinutes: { type: integer, minimum: 15, maximum: 120, description: Provider-enforced wall-clock lifetime; not a monetary billing cap }
    CreateDockerSandboxRequest:
      type: object
      required: [name, imageDigest, userId, groupId, cpuMilli, memoryMiB, workspaceMiB, pids]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        imageDigest: { type: string, minLength: 72, maxLength: 320, description: Immutable locally cached registry/image@sha256 digest }
        userId: { type: integer, minimum: 1000, maximum: 65534 }
        groupId: { type: integer, minimum: 1000, maximum: 65534 }
        cpuMilli: { type: integer, minimum: 100, maximum: 8000 }
        memoryMiB: { type: integer, minimum: 256, maximum: 16384 }
        workspaceMiB: { type: integer, minimum: 64, maximum: 2048 }
        pids: { type: integer, minimum: 16, maximum: 512 }
      additionalProperties: false
    CreateLocalSandboxRequest:
      type: object
      required: [name, root, isolation]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        root: { type: string, minLength: 1, maxLength: 4096 }
        isolation: { type: string, enum: [host, restricted_host] }
      additionalProperties: false
    Sandbox:
      type: object
      required: [sandboxId, name, backend, isolation, state, localRoot, ownerKind, ownerRef, activeLeases, backendAvailable]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        name: { type: string }
        backend: { type: string, enum: [local_workspace, docker, daytona, e2b] }
        isolation: { type: string, enum: [host, restricted_host, container, remote] }
        state: { type: string, enum: [defined, provisioning, ready, stopping, stopped, destroying, destroyed, failed, unknown, orphaned] }
        activeLeases: { type: integer, minimum: 0, description: Persisted cross-process Sandbox execution leases }
        backendAvailable: { type: boolean, description: Whether the selected backend is operational on the current Runtime host }
        localRoot: { type: string }
        ownerKind: { type: string, enum: [local_user, service] }
        ownerRef: { type: string }
      additionalProperties: false
    Tunnel:
      type: object
      required: [tunnelId, displayName, provider, externalTunnelId, runtimeCredentialRef]
      properties:
        tunnelId: { type: string }
        displayName: { type: string }
        provider: { type: string, enum: [openai] }
        externalTunnelId: { type: string }
        runtimeCredentialRef: { type: string }
    StartMCPServerRequest:
      type: object
      required: [profile, address]
      properties:
        profile: { type: string }
        address:
          type: string
          description: Loopback listen address, for example 127.0.0.1:8765
      additionalProperties: false
    MCPServerInstance:
      type: object
      required: [serverId, profile, transport, address, endpoint, status, startedAt]
      properties:
        serverId: { type: string }
        profile: { type: string }
        transport: { type: string, const: streamable-http }
        address: { type: string }
        endpoint: { type: string, format: uri }
        status: { type: string, const: running }
        startedAt: { type: string, format: date-time }
        tunnelId: { type: string }
        tunnelDisplayName: { type: string }
        tunnelProvider: { type: string, enum: [openai] }
        tunnelExternalId: { type: string }
        tunnelStatus: { type: string, enum: [running, exited] }
    AuditRecord:
      type: object
      required: [invocationId, toolId, principalKind, principalRef, startedAt, finishedAt, policyKind, policyReason, approval, status, resultKind, errorClass, errorSummary, origin, scopeKind, scopeReference, outcomeKind, rejectionCode, failureSource, failureCode]
      properties:
        invocationId: { type: string }
        toolId: { type: string }
        providerId: { type: string }
        principalKind: { type: string, enum: [local_user, service, legacy] }
        principalRef: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        policyKind: { type: string }
        policyReason: { type: string }
        approval: { type: string }
        status: { type: string }
        resultKind: { type: string }
        errorClass: { type: string }
        errorSummary:
          type: string
          description: Bounded redacted diagnostic summary. Raw arguments and result payloads are not retained.
        origin: { type: string }
        scopeKind: { type: string }
        scopeReference: { type: string }
        outcomeKind: { type: string }
        rejectionCode: { type: string }
        failureSource: { type: string }
        failureCode: { type: string }
    ProviderActivationAuditRecord:
      type: object
      required: [activationId, providerId, action, principalKind, principalRef, origin, scopeKind, scopeReference, startedAt, finishedAt, policyKind, policyReason, approval, status, errorClass, errorSummary]
      properties:
        activationId: { type: string }
        providerId: { type: string }
        action: { type: string, const: provider.activate }
        principalKind: { type: string, enum: [local_user, service] }
        principalRef: { type: string }
        origin: { type: string, enum: [cli, mcp, management_http, desktop, internal] }
        scopeKind: { type: string, enum: [catalog, profile] }
        scopeReference: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        policyKind: { type: string }
        policyReason: { type: string }
        approval: { type: string }
        status: { type: string, enum: [completed, denied, failed] }
        errorClass: { type: string }
        errorSummary:
          type: string
          description: Bounded redacted diagnostic summary. Raw Provider config and Credential material are not retained.
