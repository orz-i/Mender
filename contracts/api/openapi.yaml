      type: object
      additionalProperties: false
      required: [status, algorithm, fingerprint, hostPublicKey]
      properties:
        status: { type: string, enum: [trusted, untrusted, changed] }
        algorithm: { type: string, description: Server host public-key algorithm, not the account's login key }
        fingerprint: { type: string, description: SHA256 fingerprint of the presented server host key }
        hostPublicKey: { type: string, description: Public server host key for exact pinning on provision; do not treat it as trusted without operator confirmation }
    CreateSSHRemoteSandboxRequest:
      type: object
      additionalProperties: false
      required: [name, host, port, user, root, hostPublicKey, credentialRef]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: string, pattern: '^[a-z_][a-z0-9_-]{0,62}$' }
        root: { type: string, minLength: 2, maxLength: 1024, description: Absolute POSIX remote workspace root; NOT a chroot or shell containment guarantee }
        hostPublicKey: { type: string, minLength: 45, maxLength: 4096, description: 'Exactly one explicitly verified and pinned Ed25519, ECDSA or RSA >=2048-bit host public key in OpenSSH format; never TOFU' }
        credentialRef: { type: string, pattern: '^credential://ssh/[a-z][a-z0-9-]*$', description: Keychain-backed Mender SSH private key reference, never a raw private key }
