openapi: 3.1.0
info:
  title: Mender Management API
  version: 0.1.0
  description: Local management control plane for Mender.
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /providers:
    get:
      operationId: listProviders
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
  /providers/http:
    post:
      operationId: createHTTPProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHTTPProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/stdio:
    post:
      operationId: createStdioProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStdioProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}/sync:
    post:
      operationId: syncProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}:
    put:
      operationId: updateProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider updated and synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: deleteProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Provider deleted
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tools/browse:
    get:
      operationId: browseTools
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: providerId
          in: query
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Compact synchronized Tool list
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
  /tools:
    get:
      operationId: searchTools
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: providerId
          in: query
          schema: { type: string }
        - name: profile
          in: query
          deprecated: true
          description: Legacy Profile-scoped search. Catalog UI uses providerId.
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/{toolId}:
    get:
      operationId: getTool
      parameters:
        - $ref: '#/components/parameters/ToolId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/{toolId}/call:
    post:
      operationId: callTool
      parameters:
        - $ref: '#/components/parameters/ToolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallRequest'
      responses:
        '200':
          description: Invocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /profiles:
    get:
      operationId: listProfiles
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
    post:
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{slug}:
    get:
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{slug}/tools:
    put:
      operationId: replaceProfileTools
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceProfileToolsRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addProfileTool
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProfileToolRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{slug}/tools/{toolId}:
    delete:
      operationId: removeProfileTool
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
        - $ref: '#/components/parameters/ToolId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp/servers:
    get:
      operationId: listMCPServers
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Running managed MCP servers
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPServerInstance'
    post:
      operationId: startMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMCPServerRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: MCP server started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServerInstance'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /mcp/servers/{serverId}:
    delete:
      operationId: stopMCPServer
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: MCP server stopped
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp/servers/{serverId}/restart:
    post:
      operationId: restartMCPServer
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: MCP server restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServerInstance'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /audit:
    get:
      operationId: listAudit
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Audit records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRecord'
  /policy/status:
    get:
      operationId: getPolicyStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Current policy composition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStatus'
  /credentials/status:
    get:
      operationId: getCredentialStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Current credential resolver status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
components:
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    ToolId:
      name: toolId
      in: path
      required: true
      schema: { type: string }
    ProfileSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Request provenance rejected, or Policy/Approval denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: Provider or execution failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: false
    SystemStatus:
      type: object
      required: [ready, policy, credentials, mcp]
      properties:
        ready: { type: boolean }
        policy: { $ref: '#/components/schemas/PolicyStatus' }
        credentials: { $ref: '#/components/schemas/CredentialStatus' }
        mcp:
          type: object
          required: [stdio, streamableHttp, exposureModes]
          properties:
            stdio: { type: boolean }
            streamableHttp: { type: boolean }
            exposureModes:
              type: array
              items: { type: string, enum: [direct, dynamic, hybrid] }
    PolicyStatus:
      type: object
      required: [mode, editable, approval]
      properties:
        mode: { type: string, enum: [local_allow_all] }
        editable: { type: boolean, const: false }
        approval: { type: string, enum: [fail_closed_when_required] }
    CredentialStatus:
      type: object
      required: [resolver, persistentStore, editable]
      properties:
        resolver: { type: string, enum: [unavailable] }
        persistentStore: { type: boolean, const: false }
        editable: { type: boolean, const: false }
    Provider:
      type: object
      required: [providerId, namespace, displayName, description, createdAt, updatedAt, transport, toolCount]
      properties:
        providerId: { type: string }
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        transport: { type: string, enum: [http, stdio, unconfigured] }
        toolCount: { type: integer, minimum: 0 }
        endpoint: { type: string }
        headers:
          $ref: '#/components/schemas/HeaderTemplates'
        executable: { type: string }
        args:
          type: array
          items: { type: string }
        directory: { type: string }
    CreateHTTPProviderRequest:
      type: object
      required: [namespace, displayName, endpoint]
      properties:
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        endpoint: { type: string, format: uri }
        headers:
          $ref: '#/components/schemas/HeaderTemplates'
      additionalProperties: false
    CreateStdioProviderRequest:
      type: object
      required: [namespace, displayName, executable]
      properties:
        namespace: { type: string }
        displayName: { type: string }
        description: { type: string }
        executable: { type: string }
        args:
          type: array
          items: { type: string }
        directory: { type: string }
      additionalProperties: false
    UpdateProviderRequest:
      oneOf:
        - $ref: '#/components/schemas/UpdateHTTPProviderRequest'
        - $ref: '#/components/schemas/UpdateStdioProviderRequest'
    UpdateHTTPProviderRequest:
      type: object
      required: [transport, displayName, endpoint]
      properties:
        transport: { type: string, const: http }
        displayName: { type: string }
        description: { type: string }
        endpoint: { type: string, format: uri }
        headers:
          $ref: '#/components/schemas/HeaderTemplates'
      additionalProperties: false
    UpdateStdioProviderRequest:
      type: object
      required: [transport, displayName, executable]
      properties:
        transport: { type: string, const: stdio }
        displayName: { type: string }
        description: { type: string }
        executable: { type: string }
        args:
          type: array
          items: { type: string }
        directory: { type: string }
      additionalProperties: false
    HeaderTemplates:
      type: object
      description: Persisted HTTP header templates. Sensitive headers must reference environment variables, for example "Bearer ${ANYSEARCH_API_KEY}".
      additionalProperties:
        type: string
    ProviderMutationResponse:
      type: object
      required: [provider, sync]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        sync: { $ref: '#/components/schemas/SyncResult' }
    SyncResult:
      type: object
      required: [created, updated, removed, total]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ToolSummary:
      type: object
      required: [rank, toolId, providerId, name, title, description]
      properties:
        rank: { type: integer, minimum: 1 }
        toolId: { type: string }
        providerId: { type: string }
        name: { type: string }
        title: { type: string }
        description: { type: string }
    ToolDetail:
      type: object
      required: [toolId, providerId, sourceKey, name, title, description, inputSchema, tags]
      properties:
        toolId: { type: string }
        providerId: { type: string }
        sourceKey: { type: string }
        name: { type: string }
        title: { type: string }
        description: { type: string }
        inputSchema: {}
        outputSchema: {}
        tags:
          type: array
          items: { type: string }
    ToolCallRequest:
      type: object
      required: [arguments]
      properties:
        arguments:
          type: object
          additionalProperties: true
      additionalProperties: false
    InvocationResult:
      type: object
      required: [invocationId, kind]
      properties:
        invocationId: { type: string }
        kind: { type: string, enum: [complete, input_required, task, rejected, failed] }
        content: {}
        requestId: { type: string }
        message: { type: string }
        inputSchema: {}
        taskId: { type: string }
        status: { type: string }
        source: { type: string, enum: [tool, provider, runtime, result_guard] }
        code: { type: string }
    CreateProfileRequest:
      type: object
      required: [slug, displayName, mode]
      properties:
        slug: { type: string }
        displayName: { type: string }
        mode: { type: string, enum: [direct, dynamic, hybrid] }
      additionalProperties: false
    AddProfileToolRequest:
      type: object
      required: [toolId]
      properties:
        toolId: { type: string }
        direct: { type: boolean }
      additionalProperties: false
    ReplaceProfileToolsRequest:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ProfileTool'
      additionalProperties: false
    ProfileTool:
      type: object
      required: [toolId, direct]
      properties:
        toolId: { type: string }
        direct: { type: boolean }
    Profile:
      type: object
      required: [profileId, slug, displayName, mode, tools]
      properties:
        profileId: { type: string }
        slug: { type: string }
        displayName: { type: string }
        mode: { type: string, enum: [direct, dynamic, hybrid] }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ProfileTool' }
    StartMCPServerRequest:
      type: object
      required: [profile, address]
      properties:
        profile: { type: string }
        address:
          type: string
          description: Loopback listen address, for example 127.0.0.1:8765
      additionalProperties: false
    MCPServerInstance:
      type: object
      required: [serverId, profile, transport, address, endpoint, status, startedAt]
      properties:
        serverId: { type: string }
        profile: { type: string }
        transport: { type: string, const: streamable-http }
        address: { type: string }
        endpoint: { type: string, format: uri }
        status: { type: string, const: running }
        startedAt: { type: string, format: date-time }
    AuditRecord:
      type: object
      required: [invocationId, toolId, caller, startedAt, finishedAt, policyKind, policyReason, approval, status, resultKind, errorClass, errorSummary, origin, scopeKind, scopeReference, outcomeKind, rejectionCode, failureSource, failureCode]
      properties:
        invocationId: { type: string }
        toolId: { type: string }
        providerId: { type: string }
        caller: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        policyKind: { type: string }
        policyReason: { type: string }
        approval: { type: string }
        status: { type: string }
        resultKind: { type: string }
        errorClass: { type: string }
        errorSummary:
          type: string
          description: Bounded redacted diagnostic summary. Raw arguments and result payloads are not retained.
        origin: { type: string }
        scopeKind: { type: string }
        scopeReference: { type: string }
        outcomeKind: { type: string }
        rejectionCode: { type: string }
        failureSource: { type: string }
        failureCode: { type: string }
