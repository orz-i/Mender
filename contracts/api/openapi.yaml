  /policy/rules/{ruleId}/disable:
    post:
      operationId: disablePolicyRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: Policy Rule disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRule' }
        '404': { $ref: '#/components/responses/NotFound' }
  /credentials/status:
    get:
      operationId: getCredentialStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Current credential resolver status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
  /credentials:
    get:
      operationId: listCredentials
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Non-secret Credential inventory
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
  /credentials/native:
    post:
      operationId: createNativeCredential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNativeCredentialRequest' }
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /credentials/environment:
    post:
      operationId: createEnvironmentCredential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnvironmentCredentialRequest' }
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /credentials/{namespace}/{name}:
    get:
      operationId: getCredential
      parameters:
        - $ref: '#/components/parameters/CredentialNamespace'
        - $ref: '#/components/parameters/CredentialName'
      responses:
        '200':
          description: Credential metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCredential
      parameters:
        - $ref: '#/components/parameters/CredentialNamespace'
        - $ref: '#/components/parameters/CredentialName'
      responses:
        '204': { description: Credential deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /credentials/{namespace}/{name}/rotate:
    post:
      operationId: rotateCredential
      parameters:
        - $ref: '#/components/parameters/CredentialNamespace'
        - $ref: '#/components/parameters/CredentialName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCredentialRequest' }
      responses:
        '200':
          description: Credential metadata after rotation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }
    ToolId:
      name: toolId
      in: path
      required: true
      schema: { type: string }
    ProfileSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string }
    CredentialNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    CredentialName:
      name: name
      in: path
      required: true
      schema: { type: string }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Request provenance rejected, or Policy/Approval denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: Provider or execution failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: false
    SystemStatus:
      type: object
      required: [ready, policy, credentials, mcp]
      properties:
        ready: { type: boolean }
        policy: { $ref: '#/components/schemas/PolicyStatus' }
        credentials: { $ref: '#/components/schemas/CredentialStatus' }
        mcp:
          type: object
          required: [stdio, streamableHttp, exposureModes]
          properties:
            stdio: { type: boolean }
            streamableHttp: { type: boolean }
            exposureModes:
              type: array
              items: { type: string, enum: [direct, dynamic, hybrid] }
    RuntimeGovernanceStatus:
      type: object
      required: [budget, isolation, backend, usage]
      properties:
        budget: { $ref: '#/components/schemas/RuntimeBudget' }
        isolation: { $ref: '#/components/schemas/RuntimeIsolation' }
        backend: { $ref: '#/components/schemas/RuntimeBackend' }
        usage: { $ref: '#/components/schemas/RuntimeUsage' }
      additionalProperties: false
    RuntimeBudget:
      type: object
      required: [maxInvocations, maxPrincipalInvocations, maxProviderInvocations, maxToolInvocations, maxProviderActivations, maxExecutionTimeoutMs, maxArgumentBytes, maxResultBytes]
      properties:
        maxInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxPrincipalInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxProviderInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxToolInvocations: { type: integer, minimum: 1, maximum: 4096 }
        maxProviderActivations: { type: integer, minimum: 1, maximum: 4096 }
        maxExecutionTimeoutMs: { type: integer, format: int64, minimum: 1, maximum: 86400000 }
        maxArgumentBytes: { type: integer, minimum: 1, maximum: 67108864 }
        maxResultBytes: { type: integer, minimum: 1, maximum: 67108864 }
      additionalProperties: false
    RuntimeIsolation:
      type: object
      required: [workspaceShell, externalProvider, tunnelClient]
      properties:
        workspaceShell: { type: string, enum: [host, restricted_host] }
        externalProvider: { type: string, enum: [host, restricted_host] }
        tunnelClient: { type: string, enum: [host, restricted_host] }
      additionalProperties: false
    RuntimeBackend:
      type: object
      required: [name, restrictedHostAvailable]
      properties:
        name: { type: string }
        restrictedHostAvailable: { type: boolean }
      additionalProperties: false
    RuntimeUsage:
      type: object
      required: [invocations, activations]
      properties:
        invocations: { type: integer, minimum: 0 }
        activations: { type: integer, minimum: 0 }
      additionalProperties: false
    PolicyStatus:
      type: object
      required: [mode, editable, approval, defaultDecision, ruleCount, enabledRuleCount]
      properties:
        mode: { type: string, enum: [configured] }
        editable: { type: boolean, const: true }
        approval: { type: string, enum: [fail_closed_when_required] }
        defaultDecision: { $ref: '#/components/schemas/PolicyDecision' }
        ruleCount: { type: integer, minimum: 0 }
        enabledRuleCount: { type: integer, minimum: 0 }
    PolicyDecision:
      type: string
      enum: [allow, require_approval, deny]
    Policy:
      type: object
      required: [defaultDecision, rules]
      properties:
        defaultDecision: { $ref: '#/components/schemas/PolicyDecision' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRule' }
    PolicyDefaultRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/PolicyDecision' }
      additionalProperties: false
    PolicyRule:
      type: object
      required: [ruleId, displayName, enabled, decision, match, createdAt, updatedAt]
      properties:
        ruleId: { type: string }
        displayName: { type: string }
        enabled: { type: boolean }
        decision: { $ref: '#/components/schemas/PolicyDecision' }
        match: { $ref: '#/components/schemas/PolicyMatch' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PolicyRuleInput:
      type: object
      required: [displayName, enabled, decision, match]
      properties:
        displayName: { type: string }
        enabled: { type: boolean }
        decision: { $ref: '#/components/schemas/PolicyDecision' }
        match: { $ref: '#/components/schemas/PolicyMatch' }
      additionalProperties: false
    PolicyMatch:
      type: object
      required: [actions, origins, principalKinds, principalRefs, scopeKinds, profileRefs, providerIds, toolIds, factKnowledge, effectsAny, resourcesAny]
      properties:
        actions:
          type: array
          minItems: 1
          items: { type: string, enum: [tool.invoke, provider.activate, sandbox.acquire, sandbox.provision, sandbox.start, sandbox.stop, sandbox.destroy, sandbox.reconcile] }
        origins:
          type: array
          items: { type: string, enum: [cli, mcp, management_http, desktop, internal] }
        principalKinds:
          type: array
          items: { type: string, enum: [local_user, service] }
        principalRefs:
          type: array
          items: { type: string }
        scopeKinds:
          type: array
          items: { type: string, enum: [catalog, profile] }
        profileRefs:
          type: array
          items: { type: string }
        providerIds:
          type: array
          items: { type: string }
        toolIds:
          type: array
          items: { type: string }
        factKnowledge: { type: string, enum: [any, known, unknown] }
        effectsAny:
          type: array
          items: { type: string }
        resourcesAny:
          type: array
          items: { $ref: '#/components/schemas/PolicyResourceMatcher' }
      additionalProperties: false
    PolicyResourceMatcher:
      type: object
      required: [kind, operator, value]
      properties:
        kind: { type: string }
        operator: { type: string, enum: [exact, prefix] }
        value: { type: string }
      additionalProperties: false
    CredentialStatus:
      type: object
      required: [resolver, persistentStore, editable]
      properties:
        resolver: { type: string, enum: [inventory] }
        persistentStore: { type: boolean, const: true }
        editable: { type: boolean, const: true }
    Credential:
      type: object
      required: [reference, namespace, name, displayName, source, environmentVariable, createdAt, updatedAt]
      properties:
        reference: { type: string }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [native, environment] }
        environmentVariable: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateNativeCredentialRequest:
      type: object
      required: [namespace, name, displayName, secret]
      properties:
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        secret: { type: string, writeOnly: true }
        sshKeyPassphrase: { type: string, writeOnly: true, description: 'Optional import-time SSH private key passphrase; never stored' }
      additionalProperties: false
    CreateEnvironmentCredentialRequest:
      type: object
      required: [namespace, name, displayName, environmentVariable]
      properties:
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        environmentVariable: { type: string }
      additionalProperties: false
    RotateCredentialRequest:
      type: object
      required: [secret]
      properties:
        secret: { type: string, writeOnly: true }
        sshKeyPassphrase: { type: string, writeOnly: true, description: 'Optional import-time SSH private key passphrase; never stored' }
      additionalProperties: false
    IntegrationOffering:
      type: object
      required: [offeringId, displayName, description, kind, driverPluginId, transport, endpoint, headers, defaultNamespace, authentication, sourceUrl]
      additionalProperties: false
      properties:
        offeringId: { type: string }
        displayName: { type: string }
        description: { type: string }
        kind: { type: string, enum: [remote-mcp] }
        driverPluginId: { type: string, enum: [io.mender.provider.mcp] }
        transport: { type: string, enum: [streamable-http] }
        endpoint: { type: string, format: uri }
        headers: { type: object, additionalProperties: { type: string } }
        defaultNamespace: { type: string }
        authentication: { type: string, enum: [optional-bearer] }
        sourceUrl: { type: string, format: uri }
    PluginCatalogueEntry:
      type: object
      required: [key, pluginId, extensionId, kind, marketplaceAction, displayName, description, packageVersion, sourceKind, status, enabled, capabilities, usageCount]
      properties:
        key: { type: string }
        pluginId: { type: string }
        extensionId: { type: string }
        kind: { type: string, enum: [provider.tools, sandbox.backend, tunnel.transport, agent.backend] }
        marketplaceAction: { type: string, enum: [none, create.provider, create.sandbox, create.agent, create.tunnel] }
        displayName: { type: string }
        description: { type: string }
        packageVersion: { type: string }
        sourceKind: { type: string, enum: [builtin, local] }
        status: { type: string, enum: [enabled, disabled, invalid, unavailable] }
        enabled: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        usageCount: { type: integer, minimum: 0 }
        issue: { type: string }
        installationId: { type: string }
        digest: { type: string }
        installedAt: { type: string, format: date-time }
        configVersion: { type: integer, minimum: 1 }
        protocolVersion: { type: integer, minimum: 1 }
        configSchema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: boolean
      additionalProperties: false
    ProviderPlugin:
      type: object
      required: [pluginId, version, packageVersion, displayName, description, configVersion, sourceKind, capabilities, enabled]
      properties:
        pluginId: { type: string }
        version: { type: string }
        packageVersion: { type: string }
        displayName: { type: string }
        description: { type: string }
        configVersion: { type: integer, minimum: 1 }
        sourceKind:
          type: string
          enum: [builtin, external]
        installationId: { type: string }
        protocolVersion: { type: integer, minimum: 1 }
        configSchema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: boolean
        uiSchema:
          type: object
          additionalProperties: true
        capabilities:
          type: array
          items: { type: string }
        enabled: { type: boolean }
      additionalProperties: false
    ProviderPluginIssue:
      type: object
      required: [installationId, code, message]
      properties:
        installationId: { type: string }
        code: { type: string }
        message: { type: string, maxLength: 1024 }
      additionalProperties: false
    ProviderPluginInstallation:
      type: object
      required: [installationId, pluginId, packageVersion, sourceKind, digest, status, installedAt]
      properties:
        installationId: { type: string }
        pluginId: { type: string }
        packageVersion: { type: string }
        sourceKind:
          type: string
          enum: [local]
        digest: { type: string }
        status:
          type: string
          enum: [enabled, disabled, invalid]
        installedAt: { type: string, format: date-time }
        displayName: { type: string }
        description: { type: string }
