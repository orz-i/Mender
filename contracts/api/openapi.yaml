  /policy:
    get:
      operationId: getPolicy
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Persistent PolicySet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
  /policy/default:
    put:
      operationId: setPolicyDefault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyDefaultRequest' }
      responses:
