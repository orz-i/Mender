        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        generation: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 512 }
    SSHJobResolutionReceipt:
      type: object
      additionalProperties: false
      required: [sandboxId, generation, evidence]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        generation: { type: integer, minimum: 1 }
        evidence: { $ref: '#/components/schemas/SSHJobRecoveryRecord' }
    SSHJobRecoveryRecord:
      type: object
      additionalProperties: false
      required: [taskId, phase, state, activity, fingerprint, recoverable]
      properties:
        taskId: { type: string, pattern: '^sjob_[0-9a-f]{32}$' }
        phase: { type: string, enum: [reservation_only, manifest_only, prelaunch_candidate, dispatch_uncertain, active, terminal, resolved_before_launch, unverified] }
        state: { type: string }
        activity: { type: string, enum: [active, quiescent_proved, uncertain] }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        recoverable: { type: boolean }
    SSHJobRecoveryEvidence:
      type: object
      additionalProperties: false
      required: [records, inspectedAt, verdict]
      properties:
        records:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/SSHJobRecoveryRecord' }
        inspectedAt: { type: string, format: date-time }
        verdict: { type: string, enum: [not_enrolled, active, quiescent_proved, uncertain] }
    SSHJobRecoveryView:
      type: object
      additionalProperties: false
      required: [sandboxId, generation, managed, paused, evidence]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        generation: { type: integer, minimum: 1 }
        managed: { type: boolean }
        paused: { type: boolean }
        evidence: { $ref: '#/components/schemas/SSHJobRecoveryEvidence' }
    WorkspaceToolTarget:
      type: object
      required: [key, sandboxId]
      additionalProperties: false
      properties:
        key: { type: string }
        sandboxId: { type: string }
    BindWorkspaceToolTargetRequest:
      type: object
      required: [sandboxId]
      additionalProperties: false
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
    SandboxToolSuite:
      type: object
      required: [suiteId, sandboxId, status, available, tools]
      additionalProperties: false
      properties:
        suiteId: { type: string, enum: [sandbox.workspace, sandbox.jobs] }
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        status: { type: string, enum: [missing, ready, legacy, incomplete, conflict, incompatible] }
        available: { type: boolean }
        issue: { type: string }
        providerId: { type: string }
        providerName: { type: string }
        tools: { type: array, items: { $ref: '#/components/schemas/SandboxTool' } }
    Sandbox:
      type: object
      required: [sandboxId, name, backend, isolation, state, localRoot, ownerKind, ownerRef, activeLeases, backendAvailable]
      properties:
        sandboxId: { type: string, pattern: '^sbx_[0-9a-f]{32}$' }
        name: { type: string }
        backend: { type: string, enum: [local_workspace, docker, daytona, ssh_remote, e2b, external] }
        pluginId: { type: string }
        extensionId: { type: string }
        installationId: { type: string }
        isolation: { type: string, enum: [host, restricted_host, container, remote] }
        state: { type: string, enum: [defined, provisioning, ready, stopping, stopped, destroying, destroyed, failed, unknown, orphaned] }
        activeLeases: { type: integer, minimum: 0, description: Persisted cross-process Sandbox execution leases }
        backendAvailable: { type: boolean, description: Whether the selected backend is operational on the current Runtime host }
        localRoot: { type: string }
        ownerKind: { type: string, enum: [local_user, service] }
        ownerRef: { type: string }
      additionalProperties: false
    Tunnel:
      type: object
      required: [tunnelId, displayName, provider, externalTunnelId, runtimeCredentialRef]
      properties:
        tunnelId: { type: string }
        displayName: { type: string }
        provider: { type: string, enum: [openai, external] }
        pluginId: { type: string }
        extensionId: { type: string }
        installationId: { type: string }
        externalTunnelId: { type: string }
        runtimeCredentialRef: { type: string }
    StartMCPServerRequest:
      type: object
      required: [profile, address]
      properties:
        profile: { type: string }
        address:
          type: string
          description: Loopback listen address, for example 127.0.0.1:8765
      additionalProperties: false
    MCPServerInstance:
      type: object
      required: [serverId, profile, transport, address, endpoint, status, startedAt]
      properties:
        serverId: { type: string }
        profile: { type: string }
        transport: { type: string, const: streamable-http }
        address: { type: string }
        endpoint: { type: string, format: uri }
        status: { type: string, const: running }
        startedAt: { type: string, format: date-time }
        tunnelId: { type: string }
        tunnelDisplayName: { type: string }
        tunnelProvider: { type: string, enum: [openai, external] }
        tunnelExternalId: { type: string }
        tunnelStatus: { type: string, enum: [starting, ready, degraded, failed, exited, running] }
    AuditRecord:
      type: object
      required: [invocationId, toolId, principalKind, principalRef, startedAt, finishedAt, policyKind, policyReason, approval, status, resultKind, errorClass, errorSummary, origin, scopeKind, scopeReference, outcomeKind, rejectionCode, failureSource, failureCode]
      properties:
        invocationId: { type: string }
        toolId: { type: string }
        providerId: { type: string }
        principalKind: { type: string, enum: [local_user, service, legacy] }
        principalRef: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        policyKind: { type: string }
        policyReason: { type: string }
        approval: { type: string }
        status: { type: string }
        resultKind: { type: string }
        errorClass: { type: string }
        errorSummary:
          type: string
          description: Bounded redacted diagnostic summary. Raw arguments and result payloads are not retained.
        origin: { type: string }
        scopeKind: { type: string }
        scopeReference: { type: string }
        outcomeKind: { type: string }
        rejectionCode: { type: string }
        failureSource: { type: string }
        failureCode: { type: string }
    ProviderActivationAuditRecord:
      type: object
      required: [activationId, providerId, action, principalKind, principalRef, origin, scopeKind, scopeReference, startedAt, finishedAt, policyKind, policyReason, approval, status, errorClass, errorSummary]
      properties:
        activationId: { type: string }
        providerId: { type: string }
        action: { type: string, const: provider.activate }
        principalKind: { type: string, enum: [local_user, service] }
        principalRef: { type: string }
        origin: { type: string, enum: [cli, mcp, management_http, desktop, internal] }
        scopeKind: { type: string, enum: [catalog, profile] }
        scopeReference: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        policyKind: { type: string }
        policyReason: { type: string }
        approval: { type: string }
        status: { type: string, enum: [completed, denied, failed] }
        errorClass: { type: string }
        errorSummary:
          type: string
          description: Bounded redacted diagnostic summary. Raw Provider config and Credential material are not retained.
