        groupId: { type: integer, minimum: 1000, maximum: 65534 }
        cpuMilli: { type: integer, minimum: 100, maximum: 8000 }
        memoryMiB: { type: integer, minimum: 256, maximum: 16384 }
        workspaceMiB: { type: integer, minimum: 64, maximum: 2048 }
        pids: { type: integer, minimum: 16, maximum: 512 }
      additionalProperties: false
