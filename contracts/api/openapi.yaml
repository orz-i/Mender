openapi: 3.1.0
info:
  title: Mender Management API
  version: 0.1.0
  description: Local management control plane for Mender.
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /tool-suites:
    get:
      operationId: listToolSuites
      responses:
        '200':
          description: Reviewed host-owned Tool Suite definitions; Browser is not executable
          content:
            application/json:
              schema:
                type: object
                required: [suites]
                properties:
                  suites: { type: array, items: { $ref: '#/components/schemas/ToolSuiteDefinition' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations:
    get:
      operationId: listIntegrationOfferings
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Reviewed, inert integration configuration offerings (not live connections)
          content:
            application/json:
              schema:
                type: object
                required: [integrations]
                properties:
                  integrations: { type: array, items: { $ref: '#/components/schemas/IntegrationOffering' } }
  /plugins:
    get:
      operationId: listPluginCatalogue
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Process-free canonical Plugin Catalogue for all extension kinds
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items: { $ref: '#/components/schemas/PluginCatalogueEntry' }
  /plugin-installations/{installationId}/enable:
    post:
      operationId: enablePluginInstallation
      parameters: [{ $ref: '#/components/parameters/InstallationId' }]
      responses:
        '200':
          description: Typed installation enabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation: { $ref: '#/components/schemas/ProviderPluginInstallation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plugin-installations/{installationId}/disable:
    post:
      operationId: disablePluginInstallation
      parameters: [{ $ref: '#/components/parameters/InstallationId' }]
      responses:
        '200':
          description: Typed installation disabled when all resource domains permit
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation: { $ref: '#/components/schemas/ProviderPluginInstallation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plugin-installations/{installationId}:
    delete:
      operationId: deletePluginInstallation
      parameters: [{ $ref: '#/components/parameters/InstallationId' }]
      responses:
        '204': { description: Unreferenced typed installation removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /provider-plugins:
    get:
      operationId: listProviderPlugins
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Available built-in and enabled external Provider plugins
          content:
            application/json:
              schema:
                type: object
                required: [plugins, issues]
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderPlugin'
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderPluginIssue'
  /provider-plugin-installations:
    get:
      operationId: listProviderPluginInstallations
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Installed external Provider plugin packages
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderPluginInstallation'
  /provider-plugin-installations/{installationId}/enable:
    post:
      operationId: enableProviderPluginInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider plugin installation enabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/ProviderPluginInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /provider-plugin-installations/{installationId}/disable:
    post:
      operationId: disableProviderPluginInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider plugin installation disabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/ProviderPluginInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /provider-plugin-installations/{installationId}:
    delete:
      operationId: deleteProviderPluginInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Provider plugin installation removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills:
    get:
      operationId: listSkills
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Built-in and managed Skill installations
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillInstallation'
  /skills/{installationId}:
    get:
      operationId: getSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Exact Skill installation and bounded resource inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInspection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Managed Skill installation removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/trust:
    post:
      operationId: trustSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation trusted
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/untrust:
    post:
      operationId: untrustSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation untrusted and disabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/enable:
    post:
      operationId: enableSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation enabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/disable:
    post:
      operationId: disableSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation disabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skill-deployments:
    get:
      operationId: listSkillDeployments
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Exact Skill deployments and drift state
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillDeployment'
  /skill-deployments/{deploymentId}:
    delete:
      operationId: undeploySkill
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Skill deployment removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /providers:
    get:
      operationId: listProviders
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
    post:
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}/rebind:
    post:
      operationId: rebindProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebindProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider rebound to external plugin installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}/sync:
    post:
      operationId: syncProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}:
    put:
      operationId: updateProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider updated and synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: deleteProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Provider deleted
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tool-services/{providerId}/workspaces:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listWorkspaceToolTargets
      responses:
        '200':
          description: Additional owner-configured Sandbox targets for an existing Workspace Tool service
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces: { type: array, items: { $ref: '#/components/schemas/WorkspaceToolTarget' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool-services/{providerId}/workspaces/{workspaceKey}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
      - name: workspaceKey
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
    put:
      operationId: bindWorkspaceToolTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindWorkspaceToolTargetRequest' }
      responses:
        '204': { description: Additional governed target bound without creating another Provider or Tool }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unbindWorkspaceToolTarget
      responses:
        '204': { description: Target alias removed without altering existing ToolIDs }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/browse:
    get:
      operationId: browseTools
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: providerId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Compact synchronized Tool list
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  nextCursor: { type: string, description: Opaque continuation cursor bound to scope and Catalog revision }
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tools:
    get:
      operationId: searchTools
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: providerId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: profile
          in: query
          description: Optional Profile slug; search is restricted to the Profile\u0027s bound ToolIDs, not an invocation grant.
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  nextCursor: { type: string, description: Opaque continuation cursor bound to scope and Catalog revision }
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/{toolId}:
    get:
      operationId: getTool
      parameters:
        - $ref: '#/components/parameters/ToolId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/{toolId}/call:
    post:
      operationId: callTool
      parameters:
        - $ref: '#/components/parameters/ToolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallRequest'
      responses:
        '200':
          description: Invocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /profiles:
    get:
      operationId: listProfiles
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
    post:
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{slug}:
    get:
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{slug}/tools:
    put:
      operationId: replaceProfileTools
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceProfileToolsRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addProfileTool
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProfileToolRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{slug}/tools/{toolId}:
    delete:
      operationId: removeProfileTool
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
        - $ref: '#/components/parameters/ToolId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{slug}/tunnel:
    put:
      operationId: setProfileTunnel
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProfileTunnelRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated Profile Tunnel binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents:
    get:
      operationId: listAgents
      responses:
        '200':
          description: Configured Agent inventory without process activation
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Persisted Agent resource; no CLI launched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, pattern: '^agent_[0-9a-f]{32}$' }
    get:
      operationId: getAgent
      responses:
        '200':
          description: Agent metadata and executable availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAgent
      responses:
        '204': { description: Unreferenced Agent removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agents/{agentId}/settings:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAgentSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAgentSettingsRequest' }
      responses:
        '200':
          description: Atomically updated model and reasoning effort defaults; admitted tasks unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agents/{agentId}/models/inspect:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, pattern: '^agent_[0-9a-f]{32}$' }
    post:
      operationId: inspectAgentModels
      description: Owner-only explicit bounded ACP session inspection. Starts a CLI but submits no prompt and never persists state.
      responses:
        '200':
          description: Only models advertised by the Agent's current authenticated ACP v1 session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentModelChoices' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Backend ACP model inspection unavailable }
  /agents/{agentId}/workspaces:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAgentWorkspaces
      responses:
        '200':
          description: Owner-approved Agent-local directory paths, not Sandbox resources
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces: { type: array, items: { $ref: '#/components/schemas/AgentWorkspace' } }
  /agents/{agentId}/workspaces/{workspaceKey}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: workspaceKey
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
    put:
      operationId: bindAgentWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindAgentWorkspaceRequest' }
      responses:
        '204': { description: Existing canonical local directory bound without a Sandbox, Agent or Tool resource }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: >-
            Duplicate workspace alias (agent_workspace_alias_exists), registered
            directory (agent_workspace_directory_exists), or the Agent default
            directory (agent_workspace_default_directory). No write occurs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: unbindAgentWorkspace
      responses:
        '204': { description: Workspace binding revoked for future tasks }
  /agents/{agentId}/workspaces/{workspaceKey}/profile-grants/{profileId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: workspaceKey
        in: path
        required: true
        schema: { type: string }
      - name: profileId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: grantAgentWorkspace
      responses:
        '204': { description: Explicit Profile workspace selection grant }
    delete:
      operationId: revokeAgentWorkspace
      responses:
        '204': { description: Profile workspace grant revoked }
  /agents/{agentId}/tools:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, pattern: '^agent_[0-9a-f]{32}$' }
    get:
      operationId: getAgentTools
      responses:
        '200':
          description: Read one Agent suite binding without activating a Provider or Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTools' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: ensureAgentTools
      responses:
        '200':
          description: Explicitly create/adopt and synchronize one Agent delegation facade; never grants a Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTools' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agents/{agentId}/tasks:
    get:
      operationId: listAgentTasks
      parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Owner-visible bounded recent Agent task records
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks: { type: array, items: { $ref: '#/components/schemas/AgentTask' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agentId}/admissions:
    get:
      operationId: listAgentAdmissions
      parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Owner-visible bounded Agent Policy admission history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/AgentAdmissionEvent' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agentId}/profile-grants:
    get:
      operationId: listAgentGrants
      parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Exact ProfileID grants for one Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentGrants' }
  /agents/{agentId}/profile-grants/{profileId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
      - name: profileId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: grantAgentProfile
      responses:
        '204': { description: Profile granted Agent delegation access }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeAgentProfile
      responses:
        '204': { description: Profile Agent access revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent-tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string, pattern: '^atask_[0-9a-f]{32}$' }
    get:
      operationId: getAgentTask
      responses:
        '200':
          description: Owner-authorized persisted task status and result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTask' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent-tasks/{taskId}/cancel:
    post:
      operationId: cancelAgentTask
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      responses:
        '202':
          description: Cancellation requested; terminal stop not yet confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCancelReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes:
    get:
      operationId: listSandboxes
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Configured Sandbox inventory
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes:
                    type: array
                    items: { $ref: '#/components/schemas/Sandbox' }
  /sandboxes/backends:
    get:
      operationId: getSandboxBackends
      responses:
        '200':
          description: Real host-owned Sandbox backend capability status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxBackends' }
  /sandboxes/docker/images:
    get:
      operationId: listDockerImages
      responses:
        '200':
          description: Bounded list of locally cached and verified immutable Docker image choices
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items: { $ref: '#/components/schemas/CachedDockerImage' }
        '503':
          description: Docker Engine is unavailable or not configured
  /sandboxes/ssh-remote/host-identity:
    post:
      operationId: inspectSSHHostKey
      description: Local-operator-only, policy-admitted pre-auth SSH host identity inspection. Does not trust or persist a host or use login credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectSSHHostKeyRequest' }
      responses:
        '200':
          description: Verified SSH host public identity; unknown hosts require separate fingerprint confirmation before use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHHostIdentity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: SSH pre-auth handshake or managed known_hosts unavailable
  /sandboxes/ssh-remote:
    post:
      operationId: createSSHRemoteSandbox
      description: Admit and verify an SSH remote account; never provisions or isolates the remote host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSSHRemoteSandboxRequest' }
      responses:
        '201':
          description: Pinned SSH host and Credential verified; only Mender's local access binding was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: Remote SSH host, pinned public key, SFTP workspace or key authentication unavailable
  /sandboxes/docker:
    post:
      operationId: createDockerSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDockerSandboxRequest' }
      responses:
        '201':
          description: Governed Docker container provisioned and verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '202':
          description: Durable Docker Sandbox exists but the Engine outcome is uncertain; inspect state before attempting recovery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Docker Engine unavailable }
  /sandboxes/external:
    post:
      operationId: createExternalSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExternalSandboxRequest' }
      responses:
        '201':
          description: Externally provisioned Sandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '202':
          description: Sandbox created with uncertain provisioning; reconcile explicitly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/daytona:
    post:
      operationId: createDaytonaSandbox
      description: Provision a bounded Daytona remote Sandbox using a Mender Credential Reference. Live provider availability and billing require a connected account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDaytonaSandboxRequest' }
      responses:
        '201':
          description: Daytona Sandbox observed started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '202':
          description: Remote outcome is uncertain; resource persisted and must be reviewed, not retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Credential or remote service unavailable }
  /sandboxes/local:
    post:
      operationId: createLocalSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLocalSandboxRequest' }
      responses:
        '201':
          description: Local Sandbox admitted and created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}:
    get:
      operationId: getSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Persisted Sandbox and last observed state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: destroySandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Sandbox tombstoned. The local host directory is NOT deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/tools:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: getSandboxTools
      responses:
        '200':
          description: Inspect resource-bound Workspace Tool Suite without executing or repairing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxToolSuite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: ensureSandboxTools
      responses:
        '200':
          description: Explicitly create/adopt Workspace Tool Suite without granting Profile access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxToolSuite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeSandboxTools
      responses:
        '204': { description: Unreferenced resource-owned Workspace Tool Suite retired }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/job-tools:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: getSandboxJobTools
      responses:
        '200':
          description: Read only the explicit resource-bound SSH Jobs Tool Suite; never connects remotely
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxToolSuite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: ensureSandboxJobTools
      responses:
        '200':
          description: Explicitly provision an SSH Jobs facade without assigning Profile permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxToolSuite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeSandboxJobTools
      responses:
        '204': { description: Unreferenced, quiescent SSH Jobs facade retired; TaskIDs and lifecycle marker remain }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/jobs/admission:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: getSSHJobAdmission
      description: Read persisted owner-controlled pause state; never connects to SSH.
      responses:
        '200':
          description: Current local admission flag and Run generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHJobAdmissionState' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setSSHJobAdmission
      description: Owner-only pause/resume new Jobs; does not stop existing tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSSHJobAdmissionRequest' }
      responses:
        '200':
          description: Committed pause state with durable change event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHJobAdmissionState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/jobs/recovery:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: getSSHJobRecovery
      description: Owner-only read-only evidence for execution-fenced v2 SSH Jobs; does not release leases or mutate tasks.
      responses:
        '200':
          description: Bounded backend-owned recovery evidence. No command, log, credential or remote path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHJobRecoveryView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/jobs/recovery/{taskId}/resolve:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - in: path
        name: taskId
        required: true
        schema: { type: string, pattern: '^sjob_[0-9a-f]{32}$' }
    post:
      operationId: resolveSSHJobRecovery
      description: Owner-only explicit v2 prelaunch adjudication after a persisted admission pause and exact evidence review; never a model-facing Tool.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveSSHJobRecoveryRequest' }
      responses:
        '200':
          description: Operational quiescence proven without fabricating command exit; audit committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHJobResolutionReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: Backend unavailable or recovery proof not established; unknown preserved
  /sandboxes/{sandboxId}/activity:
    get:
      operationId: getSandboxActivity
      description: Last 1-100 non-secret Sandbox admission and successful lifecycle events, newest first. No credential, Tool arguments or principal references.
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Durable Sandbox activity history without private payloads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/profile-grants:
    get:
      operationId: getSandboxProfileGrants
      description: Owner-only current Profile capability grants; ungranted by default.
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Current explicit Profile access to a Sandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxProfileGrants' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/profile-grants/{profileId}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - in: path
        name: profileId
        required: true
        schema: { type: string, pattern: '^prof_[0-9a-f]{32}$' }
    put:
      operationId: putSandboxProfileGrants
      description: The local owner replaces one existing Profile's allowed capabilities. No implicit grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSandboxProfileGrantsRequest' }
      responses:
        '200':
          description: Replaced capability grant set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxProfileGrants' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: revokeSandboxProfileGrants
      description: Owner revokes all of one Profile's capabilities. In-progress durable leases are not force-aborted.
      responses:
        '200':
          description: Revocation complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxProfileGrants' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/profile-grant-events:
    get:
      operationId: getSandboxProfileGrantEvents
      description: Last 100 owner-only grant/revoke audit events, newest first.
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Sanitized Profile grant/revoke history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxProfileGrantEvents' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/daytona/reconcile:
    post:
      operationId: reconcileDaytonaSandbox
      description: Read-only reconciliation of a provisioned unknown Daytona Sandbox, no remote create replay
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Remote state inspected and verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Remote API unavailable }
  /sandboxes/{sandboxId}/reconcile:
    post:
      operationId: reconcileDockerSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Existing unknown Docker container verified, no new container created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Unavailable Docker Engine }
  /sandboxes/{sandboxId}/start:
    post:
      operationId: startSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Local Sandbox revalidated and started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/stop:
    post:
      operationId: stopSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Local Sandbox made unavailable for new executions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tunnels:
    get:
      operationId: listTunnels
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Tunnel configurations
          content:
