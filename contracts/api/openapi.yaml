        '200':
          description: Updated Runtime governance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeGovernanceStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /runtime-governance/isolation:
    put:
      operationId: updateRuntimeIsolation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeIsolation' }
      responses:
        '200':
          description: Updated Runtime governance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeGovernanceStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /policy/status:
    get:
      operationId: getPolicyStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Current policy composition
          content:
