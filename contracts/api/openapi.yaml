openapi: 3.1.0
info:
  title: Mender Management API
  version: 0.1.0
  description: Local management control plane for Mender.
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /provider-plugins:
    get:
      operationId: listProviderPlugins
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Available built-in and enabled external Provider plugins
          content:
            application/json:
              schema:
                type: object
                required: [plugins, issues]
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderPlugin'
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderPluginIssue'
  /provider-plugin-installations:
    get:
      operationId: listProviderPluginInstallations
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Installed external Provider plugin packages
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderPluginInstallation'
  /provider-plugin-installations/{installationId}/enable:
    post:
      operationId: enableProviderPluginInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider plugin installation enabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/ProviderPluginInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /provider-plugin-installations/{installationId}/disable:
    post:
      operationId: disableProviderPluginInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider plugin installation disabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/ProviderPluginInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /provider-plugin-installations/{installationId}:
    delete:
      operationId: deleteProviderPluginInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Provider plugin installation removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills:
    get:
      operationId: listSkills
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Built-in and managed Skill installations
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillInstallation'
  /skills/{installationId}:
    get:
      operationId: getSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Exact Skill installation and bounded resource inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInspection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Managed Skill installation removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/trust:
    post:
      operationId: trustSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation trusted
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/untrust:
    post:
      operationId: untrustSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation untrusted and disabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/enable:
    post:
      operationId: enableSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation enabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skills/{installationId}/disable:
    post:
      operationId: disableSkillInstallation
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Skill installation disabled
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: '#/components/schemas/SkillInstallation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /skill-deployments:
    get:
      operationId: listSkillDeployments
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Exact Skill deployments and drift state
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillDeployment'
  /skill-deployments/{deploymentId}:
    delete:
      operationId: undeploySkill
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Skill deployment removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /providers:
    get:
      operationId: listProviders
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
    post:
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/http:
    post:
      deprecated: true
      operationId: createHTTPProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHTTPProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/stdio:
    post:
      deprecated: true
      operationId: createStdioProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStdioProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}/rebind:
    post:
      operationId: rebindProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebindProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider rebound to external plugin installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}/sync:
    post:
      operationId: syncProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /providers/{providerId}:
    put:
      operationId: updateProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Provider updated and synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMutationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: deleteProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Provider deleted
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tools/browse:
    get:
      operationId: browseTools
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: providerId
          in: query
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Compact synchronized Tool list
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
  /tools:
    get:
      operationId: searchTools
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: providerId
          in: query
          schema: { type: string }
        - name: profile
          in: query
          deprecated: true
          description: Legacy Profile-scoped search. Catalog UI uses providerId.
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/{toolId}:
    get:
      operationId: getTool
      parameters:
        - $ref: '#/components/parameters/ToolId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Tool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /tools/{toolId}/call:
    post:
      operationId: callTool
      parameters:
        - $ref: '#/components/parameters/ToolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallRequest'
      responses:
        '200':
          description: Invocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /profiles:
    get:
      operationId: listProfiles
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
    post:
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{slug}:
    get:
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{slug}/tools:
    put:
      operationId: replaceProfileTools
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceProfileToolsRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addProfileTool
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProfileToolRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /profiles/{slug}/tools/{toolId}:
    delete:
      operationId: removeProfileTool
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
        - $ref: '#/components/parameters/ToolId'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{slug}/tunnel:
    put:
      operationId: setProfileTunnel
      parameters:
        - $ref: '#/components/parameters/ProfileSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProfileTunnelRequest'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated Profile Tunnel binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes:
    get:
      operationId: listSandboxes
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Configured Sandbox inventory
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes:
                    type: array
                    items: { $ref: '#/components/schemas/Sandbox' }
  /sandboxes/backends:
    get:
      operationId: getSandboxBackends
      responses:
        '200':
          description: Real host-owned Sandbox backend capability status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxBackends' }
  /sandboxes/docker:
    post:
      operationId: createDockerSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDockerSandboxRequest' }
      responses:
        '201':
          description: Governed Docker container provisioned and verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '202':
          description: Durable Docker Sandbox exists but the Engine outcome is uncertain; inspect state before attempting recovery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Docker Engine unavailable }
  /sandboxes/daytona:
    post:
      operationId: createDaytonaSandbox
      description: Provision a bounded Daytona remote Sandbox using a Mender Credential Reference. Live provider availability and billing require a connected account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDaytonaSandboxRequest' }
      responses:
        '201':
          description: Daytona Sandbox observed started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '202':
          description: Remote outcome is uncertain; resource persisted and must be reviewed, not retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Credential or remote service unavailable }
  /sandboxes/local:
    post:
      operationId: createLocalSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLocalSandboxRequest' }
      responses:
        '201':
          description: Local Sandbox admitted and created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}:
    get:
      operationId: getSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Persisted Sandbox and last observed state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: destroySandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Sandbox tombstoned. The local host directory is NOT deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/activity:
    get:
      operationId: getSandboxActivity
      description: Last 1-100 non-secret Sandbox admission and successful lifecycle events, newest first. No credential, Tool arguments or principal references.
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Durable Sandbox activity history without private payloads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/profile-grants:
    get:
      operationId: getSandboxProfileGrants
      description: Owner-only current Profile capability grants; ungranted by default.
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Current explicit Profile access to a Sandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxProfileGrants' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/profile-grants/{profileId}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - in: path
        name: profileId
        required: true
        schema: { type: string, pattern: '^prof_[0-9a-f]{32}$' }
    put:
      operationId: putSandboxProfileGrants
      description: The local owner replaces one existing Profile's allowed capabilities. No implicit grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSandboxProfileGrantsRequest' }
