      type: object
      required: [name, credentialRef, imageDigest, target, cpu, memoryGiB, diskGiB, ttlMinutes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        credentialRef: { type: string, pattern: '^credential://[a-z][a-z0-9-]*/[a-z][a-z0-9-]*$', description: Reference to Mender's secret inventory, never plaintext }
        imageDigest: { type: string, minLength: 72, maxLength: 320 }
        target: { type: string, enum: [us] }
        cpu: { type: integer, minimum: 1, maximum: 2 }
        memoryGiB: { type: integer, minimum: 1, maximum: 4 }
        diskGiB: { type: integer, minimum: 3, maximum: 10 }
        ttlMinutes: { type: integer, minimum: 15, maximum: 120, description: Provider-enforced wall-clock lifetime; not a monetary billing cap }
    CreateExternalSandboxRequest:
      type: object
      required: [name, installationId, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        installationId: { type: string }
        config:
          type: object
          description: Host-reviewed non-secret JSON constrained by exact plugin schema
          additionalProperties: true
      additionalProperties: false
    CachedDockerImage:
      type: object
      required: [imageDigest, displayName]
      properties:
        imageDigest: { type: string, minLength: 72, maxLength: 320, description: Exact locally verified immutable image manifest digest }
